<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> My Colour Card</title>
        <style>
            *{
                font-size: 20px;
            }
            body{
                background-color: yellow;
            }
            h1{
                color: red;
            }
            h2{
                color: blue;
            }
            p{
                color: dimgray;
            }
            /* Class selector */
            .about-me{
                color: green;
                font-weight: bold;
            }
            /* ID selector */
            #mycard{
                background-color: lightblue;
                padding: 20px;
                border-radius: 10px;
            }
           p{
                font-size: 20px;
           }
           .y{
                color: black;
           }

        </style>
    </head>
    <body>
<h1>My Colour Card</h1>
<p style="color: blue; font-size: 30px;">
    This is my very colourful webpage.
</p>
<div id="mycard">
    <h2>About Me</h2>
    <p class="about-me">I am Akansha.</p>
    <p class="about-me">I am a student.</p>
    <p class="about-me">I am learning web development.</p>
</div>
<h2> My favourite things</h2>
<p> Instruments</p>
<p> Guitar</p>
<p> Piano</p>
    </body>
</html>
